name: Validate curated extensions
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: extension-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --check
      - run: python scripts/test_build.py
      - run: python scripts/test_update_feed.py
